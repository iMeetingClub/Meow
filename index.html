<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="meow 生活 — 一张大地图就是所有去处：点小猫看喵花名，点大树看喵星事，点屋顶看猫屋计划，点蝴蝶看故事。" />
    <title>meow 生活</title>
    <!-- PWA：可以安装为手机 web app -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#ffc53d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="meow 生活" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="stylesheet" href="/src/style.css" />
    <style>
      /* 首页就是一张大地图：整页只有图，没有其他文字，留白多，内容逐步往图里加。 */
      html, body { background: #fdf9ef; }
      body { min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
      .map-wrap {
        position: relative;
        /* 手机全屏：图尽可能大，宽高都不超出视口，6:7 比例；aspect-ratio 把图和描边锁死 */
        width: min(100vw, calc(100dvh * 6 / 7));
        max-width: 720px;
        aspect-ratio: 6 / 7;
      }
      .map-wrap img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .map-wrap .hotspot {
        position: absolute;
        display: block;
        cursor: pointer;
        border-radius: 16px;
        transition: outline-color 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
        outline: 3px solid transparent;
        outline-offset: 2px;
      }
      /* 贴合轮廓的橘色描边：SVG 路径，平时隐藏，悬停／点按时出现 */
      .map-wrap .outlines {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      .map-wrap .outlines path {
        fill: none;
        stroke: #e8821e;
        stroke-width: 6;
        stroke-linecap: round;
        stroke-linejoin: round;
        opacity: 0;
        transition: opacity 0.25s ease;
      }
      .map-wrap .outlines path.glow {
        stroke-width: 14;
        opacity: 0;
        stroke: #e8821e;
      }
      /* 电脑版：鼠标悬停，橘色描边＋淡黄底＋微光，像按钮 */
      @media (hover: hover) {
        .map-wrap .hotspot:hover,
        .map-wrap .hotspot:focus-visible {
          outline-color: #e8821e;
          background: rgba(255, 197, 61, 0.18);
          box-shadow: 0 0 0 4px rgba(232, 130, 30, 0.15);
        }
        /* 小猫和屋顶用贴合轮廓的描边，不用方框 */
        .map-wrap .hs-cat-l:hover,
        .map-wrap .hs-cat-r:hover,
        .map-wrap .hs-tools:hover,
        .map-wrap .hs-tree:hover,
        .map-wrap .hs-cat-l:focus-visible,
        .map-wrap .hs-cat-r:focus-visible,
        .map-wrap .hs-tools:focus-visible,
        .map-wrap .hs-tree:focus-visible {
          outline-color: transparent;
          background: transparent;
          box-shadow: none;
        }
        .map-wrap .hs-cat-l:hover ~ .outlines .outline-cat-l,
        .map-wrap .hs-cat-r:hover ~ .outlines .outline-cat-r,
        .map-wrap .hs-tools:hover ~ .outlines .outline-roof,
        .map-wrap .hs-tree:hover ~ .outlines .outline-tree {
          opacity: 1;
        }
        .map-wrap .hs-cat-l:hover ~ .outlines .outline-cat-l.glow,
        .map-wrap .hs-cat-r:hover ~ .outlines .outline-cat-r.glow,
        .map-wrap .hs-tools:hover ~ .outlines .outline-roof.glow,
        .map-wrap .hs-tree:hover ~ .outlines .outline-tree.glow {
          opacity: 0.3;
        }
      }
      /* 手机版：没有悬停，描边平时就清楚地常驻（0.6）并轻轻呼吸，让人一眼看得出哪里可以点；点按时变实 */
      @media (hover: none) {
        /* 手机版平时不常驻描边，只留橘色点点在闪；点按时描边才出现 */
        .map-wrap .outlines path {
          opacity: 0;
        }
        .map-wrap .outlines path.glow {
          opacity: 0;
        }
        .map-wrap .hotspot:active {
          outline-color: #e8821e;
          background: rgba(255, 197, 61, 0.22);
        }
        .map-wrap .hs-cat-l:active,
        .map-wrap .hs-cat-r:active,
        .map-wrap .hs-tools:active,
        .map-wrap .hs-tree:active {
          outline-color: transparent;
          background: transparent;
        }
        .map-wrap .hs-cat-l:active ~ .outlines .outline-cat-l,
        .map-wrap .hs-cat-r:active ~ .outlines .outline-cat-r,
        .map-wrap .hs-tools:active ~ .outlines .outline-roof,
        .map-wrap .hs-tree:active ~ .outlines .outline-tree {
          opacity: 1;
        }
        .map-wrap .hs-cat-l:active ~ .outlines .outline-cat-l.glow,
        .map-wrap .hs-cat-r:active ~ .outlines .outline-cat-r.glow,
        .map-wrap .hs-tools:active ~ .outlines .outline-roof.glow,
        .map-wrap .hs-tree:active ~ .outlines .outline-tree.glow {
          opacity: 0.3;
        }
      }
      .map-wrap .hotspot .dot {
        position: absolute;
        right: 6%;
        top: 6%;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #e8821e;
        box-shadow: 0 0 0 3px rgba(232, 130, 30, 0.25);
        animation: dot-pulse 1.8s ease-in-out infinite;
      }
      @media (hover: hover) {
        /* 电脑版有鼠标悬停提示，小圆点就不用了 */
        .map-wrap .hotspot .dot { display: none; }
      }
      @keyframes dot-pulse {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.35); opacity: 0.55; }
      }
      /* 大树 -> 喵星事（与meow星事，树干有猫抓痕） */
      .map-wrap .hs-tree { left: 0%; top: 30%; width: 14%; height: 30%; }
      /* 左边小猫 -> 喵花名（只留左边） */
      .map-wrap .hs-cat-l { left: 3%; top: 74%; width: 21%; height: 12%; }
      /* 右边小猫 -> Meow传（故事，追蝴蝶那只） */
      .map-wrap .hs-cat-r { left: 80%; top: 71%; width: 17%; height: 15%; }
      /* 圆门口（正中间的猫） -> 分享这张图 */
      .map-wrap .hs-act { left: 31%; top: 57%; width: 24%; height: 18%; }
      /* 蝴蝶 -> Meow传（故事） */
      .map-wrap .hs-story { left: 73%; top: 65%; width: 17%; height: 10%; }
      /* 屋顶（锤子、钉子、木板）-> 猫屋计划（季节页） */
      .map-wrap .hs-tools { left: 21%; top: 41%; width: 69%; height: 12%; }
      footer {
        width: 100%;
        max-width: 720px;
        text-align: center;
        font-size: 0.85rem;
        color: #8a7d67;
        padding: 0.6rem 1rem 1rem;
      }
      footer a { color: inherit; }
      footer .version { margin: 0.3rem 0 0; }

      /* 分享弹窗：遮罩＋居中卡片，图实时生成后放进来 */
      .share-modal {
        position: fixed;
        inset: 0;
        z-index: 300;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(45, 40, 35, 0.6);
        padding: 16px;
      }
      .share-modal.is-open { display: flex; }
      .share-card {
        background: #fdf9ef;
        border-radius: 16px;
        padding: 16px;
        max-width: 480px;
        width: 100%;
        text-align: center;
      }
      .share-card img {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 8px;
        background: #fff;
      }
      .share-card .share-status { color: #8a7d67; font-size: 0.9rem; margin: 0.8rem 0; }
      .share-card .share-actions { display: flex; gap: 12px; justify-content: center; }
      .share-card .share-save {
        display: inline-block;
        padding: 0.6rem 1.4rem;
        border-radius: 999px;
        background: #e8821e;
        color: #fff;
        text-decoration: none;
      }
      .share-card .share-close {
        padding: 0.6rem 1.2rem;
        border-radius: 999px;
        border: 1px solid #e2d8c3;
        background: transparent;
        color: #8a7d67;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main class="map-wrap">
      <img
        src="/illustrations/meow-poster-map-20261109-1512.png"
        alt="meow 生活猫屋地图：木屋前，呦唬和孩子们在院子里"
        fetchpriority="high"
      />
      <a class="hotspot hs-tree" href="./stories.html" title="喵星事：大家的故事"><span class="dot"></span></a>
      <a class="hotspot hs-cat-l" href="./cats.html" title="喵花名：所有猫咪的名字"><span class="dot"></span></a>
      <a class="hotspot hs-cat-r" href="./story.html" title="Meow传：故事"><span class="dot"></span></a>
      <a class="hotspot hs-act" href="#" data-share-open title="分享这张图：邀请别人来玩"><span class="dot"></span></a>
      <a class="hotspot hs-story" href="./story.html" title="Meow传：故事"><span class="dot"></span></a>

    </main>
    <footer>
      <p><a href="https://github.com/iMeetingClub/Meow" target="_blank" rel="noopener">欢迎改进</a></p>
    </footer>

    <div class="share-modal" data-share-modal aria-hidden="true" role="dialog" aria-label="分享图">
      <div class="share-card">
        <img data-share-img alt="分享图生成中…" />

          <a class="share-save" data-share-save href="#" download="meow-生活-分享图.png">保存图片</a>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
