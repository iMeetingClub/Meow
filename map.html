<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="meow 生活 — 一张大地图就是所有去处：点猫屋看猫屋计划，点牌子看喵花名，点蝴蝶看故事。" />
    <title>meow 生活</title>
    <!-- PWA：可以安装为手机 web app -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#ffc53d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="meow 生活" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="stylesheet" href="/src/style.css" />
    <style>
      /* 首页就是一张大地图：整页只有图，没有其他文字，留白多，内容逐步往图里加。 */
      html, body { background: #fdf9ef; }
      body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
      .map-wrap {
        position: relative;
        max-width: 720px;
        width: 100%;
      }
      .map-wrap img {
        display: block;
        width: 100%;
        height: auto;
      }
      .map-wrap .hotspot {
        position: absolute;
        display: block;
        cursor: pointer;
      }
      /* 告示牌 喵花名 -> 所有猫咪的名字 */
      .map-wrap .hs-cats { left: 52.8%; top: 79.8%; width: 13.9%; height: 5.4%; }
      /* 圆门口 猫屋计划 -> 猫屋搭建（季节页） */
      .map-wrap .hs-act { left: 29%; top: 56%; width: 22%; height: 22%; }
      /* 蝴蝶 Meow传 -> 故事 */
      .map-wrap .hs-story { left: 74%; top: 57%; width: 13%; height: 17%; }
      /* 二维码 -> 首页（手机长按扫码进站） */
      .map-wrap .hs-qr { left: 33.3%; top: 83.6%; width: 16.5%; height: 14.2%; }
      footer {
        width: 100%;
        max-width: 720px;
        text-align: center;
        font-size: 0.85rem;
        color: #8a7d67;
        padding: 1.2rem 1rem 1.6rem;
      }
      footer a { color: inherit; }
      footer .version { margin: 0.3rem 0 0; }
    </style>
  </head>
  <body>
    <main class="map-wrap">
      <img
        src="/illustrations/meow-poster-map.png"
        alt="meow 生活猫屋地图：木屋前，呦唬和孩子们在院子里"
        fetchpriority="high"
      />
      <a class="hotspot hs-cats" href="./cats.html" title="喵花名：所有猫咪的名字"></a>
      <a class="hotspot hs-act" href="./season.html" title="猫屋计划：猫屋搭建"></a>
      <a class="hotspot hs-story" href="./story.html" title="Meow传：故事"></a>
      <a class="hotspot hs-qr" href="./index.html" title="扫码进入 meow.imeeting.club"></a>
    </main>
    <footer>
      <p><a href="https://github.com/iMeetingClub/Meow" target="_blank" rel="noopener">欢迎改进</a></p>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
