<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="meow 生活 — 一张大地图就是所有去处：点小猫看喵花名，点工具看猫屋计划，点蝴蝶看故事。" />
    <title>meow 生活</title>
    <!-- PWA：可以安装为手机 web app -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#ffc53d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="meow 生活" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="stylesheet" href="/src/style.css" />
    <style>
      /* 首页就是一张大地图：整页只有图，没有其他文字，留白多，内容逐步往图里加。 */
      html, body { background: #fdf9ef; }
      body { min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
      .map-wrap {
        position: relative;
        /* 手机全屏：图尽可能大，宽高都不超出视口，6:7 比例 */
        width: min(100vw, calc(100dvh * 6 / 7));
        max-width: 720px;
      }
      .map-wrap img {
        display: block;
        width: 100%;
        height: auto;
      }
      .map-wrap .hotspot {
        position: absolute;
        display: block;
        cursor: pointer;
        border-radius: 16px;
        transition: outline-color 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
        outline: 3px solid transparent;
        outline-offset: 2px;
      }
      /* 电脑版：鼠标悬停，橘色描边＋淡黄底＋微光，像按钮 */
      @media (hover: hover) {
        .map-wrap .hotspot:hover,
        .map-wrap .hotspot:focus-visible {
          outline-color: #e8821e;
          background: rgba(255, 197, 61, 0.18);
          box-shadow: 0 0 0 4px rgba(232, 130, 30, 0.15);
        }
      }
      /* 手机版：点按时亮橘边；平时每个可点处有个小圆点轻轻跳，提示可以点 */
      .map-wrap .hotspot:active {
        outline-color: #e8821e;
        background: rgba(255, 197, 61, 0.22);
      }
      .map-wrap .hotspot .dot {
        position: absolute;
        right: 6%;
        top: 6%;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #e8821e;
        box-shadow: 0 0 0 3px rgba(232, 130, 30, 0.25);
        animation: dot-pulse 1.8s ease-in-out infinite;
      }
      @media (hover: hover) {
        /* 电脑版有鼠标悬停提示，小圆点就不用了 */
        .map-wrap .hotspot .dot { display: none; }
      }
      @keyframes dot-pulse {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.35); opacity: 0.55; }
      }
      /* 左边小猫 -> 喵花名 */
      .map-wrap .hs-cat-l { left: 3%; top: 74%; width: 21%; height: 12%; }
      /* 右边小猫 -> 喵花名 */
      .map-wrap .hs-cat-r { left: 80%; top: 71%; width: 17%; height: 15%; }
      /* 圆门口 -> 猫屋计划（季节页） */
      .map-wrap .hs-act { left: 31%; top: 57%; width: 24%; height: 18%; }
      /* 蝴蝶 -> Meow传（故事） */
      .map-wrap .hs-story { left: 73%; top: 65%; width: 17%; height: 10%; }
      /* 屋顶工具（锤子、钉子、木板）-> 猫屋计划（季节页） */
      .map-wrap .hs-tools { left: 30%; top: 41%; width: 55%; height: 8%; }
      footer {
        width: 100%;
        max-width: 720px;
        text-align: center;
        font-size: 0.85rem;
        color: #8a7d67;
        padding: 1.2rem 1rem 1.6rem;
      }
      footer a { color: inherit; }
      footer .version { margin: 0.3rem 0 0; }
    </style>
  </head>
  <body>
    <main class="map-wrap">
      <img
        src="/illustrations/meow-poster-map.png"
        alt="meow 生活猫屋地图：木屋前，呦唬和孩子们在院子里"
        fetchpriority="high"
      />
      <a class="hotspot hs-cat-l" href="./cats.html" title="喵花名：所有猫咪的名字"><span class="dot"></span></a>
      <a class="hotspot hs-cat-r" href="./cats.html" title="喵花名：所有猫咪的名字"><span class="dot"></span></a>
      <a class="hotspot hs-act" href="./season.html" title="猫屋计划：猫屋搭建"><span class="dot"></span></a>
      <a class="hotspot hs-story" href="./story.html" title="Meow传：故事"><span class="dot"></span></a>
      <a class="hotspot hs-tools" href="./season.html" title="猫屋计划：修砌中的猫屋"><span class="dot"></span></a>
    </main>
    <footer>
      <p><a href="https://github.com/iMeetingClub/Meow" target="_blank" rel="noopener">欢迎改进</a></p>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
